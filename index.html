<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="FSST//LAB — TRON-styled computer-vision Four Square Step Test biomechanics lab. Runs entirely in the browser. Screening and research tool, not a medical device.">
<title>FSST//LAB — Four Square Step Test Biomechanics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- animated TRON backdrop (disabled during the live test and under reduced-motion) -->
<div class="tron-bg" aria-hidden="true">
  <div class="grid-floor"></div>
  <div class="particles"></div>
  <div class="scanlines"></div>
</div>

<!-- rotate-to-portrait blocker, shown only during a live session in landscape -->
<div class="rotate-blocker" aria-hidden="true">
  <div class="icon">📱↻</div>
  <h2>Rotate to portrait</h2>
  <p>The Four Square Step Test runs in portrait. Analysis is paused until you rotate the phone upright.</p>
</div>

<main id="app"></main>

<script src="js/config.js"></script>
<script src="js/schema.js"></script>
<script src="js/geometry.js"></script>
<script src="js/analysis.js"></script>
<script src="js/export.js"></script>
<script src="js/charts.js"></script>
<script src="js/pose-engine.js"></script>
<script src="js/live.js"></script>
<script src="js/app.js"></script>
</body>
</html>
