<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSST//LAB — Data Dictionary Generator</title>
<style>
  body { background: #05070d; color: #dfe9ff; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; }
  h1 { color: #00d4ff; letter-spacing: 2px; font-size: 1.2rem; }
  button { background: transparent; color: #ff6a00; border: 1.5px solid #ff6a00; padding: 10px 18px; font-weight: 700; cursor: pointer; letter-spacing: 1px; margin-right: 8px; }
  textarea { width: 100%; height: 60vh; margin-top: 14px; background: #0a1120; color: #dfe9ff; border: 1px solid rgba(0,212,255,0.3); font-family: monospace; font-size: .8rem; }
  .err { color: #ff3b30; }
</style>
</head>
<body>
<h1>FSST//LAB — DATA DICTIONARY GENERATOR</h1>
<p>Generates <code>DATA_DICTIONARY.md</code> from the schema and config. Click Generate, then Download, and save the file to the project root.</p>
<button id="gen">Generate</button>
<button id="dl">Download DATA_DICTIONARY.md</button>
<div id="msg"></div>
<textarea id="out" readonly></textarea>

<script src="../js/config.js"></script>
<script src="../js/schema.js"></script>
<script src="build-dictionary.js"></script>
<script>
  const out = document.getElementById('out'), msg = document.getElementById('msg');
  function gen() {
    try { out.value = FSSTDictionary.build(CONFIG, SCHEMA); msg.textContent = 'Generated ' + out.value.length + ' characters.'; msg.className = ''; }
    catch (e) { out.value = ''; msg.textContent = e.message; msg.className = 'err'; }
  }
  document.getElementById('gen').onclick = gen;
  document.getElementById('dl').onclick = () => {
    if (!out.value) gen();
    const blob = new Blob([out.value], { type: 'text/markdown' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'DATA_DICTIONARY.md';
    document.body.appendChild(a); a.click(); a.remove();
  };
  gen();
</script>
</body>
</html>
